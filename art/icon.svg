<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F2C"/>
      <stop offset="0.55" stop-color="#1B1050"/>
      <stop offset="1" stop-color="#3A1370"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#FF3DCB"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="256" r="230" fill="url(#aura)"/>
    <!-- glass disc -->
    <circle cx="256" cy="256" r="150" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
    <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 316.5 159.5 A 114 114 0 1 1 195.5 159.5" stroke-width="22"/>
      <path d="M 208 226 L 256 306 L 304 226" stroke-width="26"/>
    </g>
    <circle cx="256" cy="150" r="15" fill="#B6FF3B" filter="url(#glow)"/>
  </g>
</svg>
